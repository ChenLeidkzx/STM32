<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阳光伴学助手 · 登录</title>
    <style>
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 20px;
            background: #f4f7f5;
            color: #18352d;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        .panel {
            background: #fff;
            border: 1px solid #d7e4dd;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 12px 30px rgba(24, 53, 45, .08);
        }
        h1, h2 { margin-top: 0; }
        input, select, textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            margin: 10px 0 16px;
            border: 1px solid #cfe0d8;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
        }
        textarea {
            min-height: 110px;
            resize: vertical;
        }
        button {
            border: none;
            border-radius: 8px;
            background: #2b7a5a;
            color: white;
            padding: 12px 14px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button.secondary {
            background: #6d8c7d;
        }
        button:hover { background: #23664d; }
        button.secondary:hover { background: #5d7c6f; }
        .status {
            margin-top: 18px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #edf7f1;
            color: #1a6242;
            display: none;
        }
        .status.error {
            background: #fff1f0;
            color: #a63b35;
        }
        .hint {
            color: #60756c;
            line-height: 1.8;
        }
        code {
            background: #edf5ef;
            padding: 3px 7px;
            border-radius: 4px;
        }
        #dashboard {
            display: none;
            margin-top: 28px;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        #adminSection {
            display: none;
            margin-top: 24px;
        }
        ul {
            padding-left: 18px;
        }
        li {
            margin-bottom: 10px;
            color: #27443a;
        }
        .inline-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .inline-actions button {
            flex: 1;
        }
        @media (max-width: 760px) {
            .container, #dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <main>
        <section id="authPanel" class="container">
            <section class="panel">
                <h1>阳光伴学助手</h1>
                <p class="hint">云端多用户系统已启用。先注册账号，再登录使用。</p>
                <p class="hint">健康检查：<code>/health</code></p>
                <div id="status" class="status"></div>
            </section>

            <section class="panel">
                <h2>注册</h2>
                <form id="registerForm">
                    <label>用户名</label>
                    <input type="text" id="registerUsername" placeholder="例如：alice" required>
                    <label>密码</label>
                    <input type="password" id="registerPassword" placeholder="至少 6 位" required>
                    <label>角色</label>
                    <select id="registerRole">
                        <option value="user">普通用户</option>
                        <option value="admin">管理员</option>
                    </select>
                    <button type="submit">注册</button>
                </form>

                <hr style="margin: 24px 0; border: 0; border-top: 1px solid #e1ece5;">

                <h2>登录</h2>
                <form id="loginForm">
                    <label>用户名</label>
                    <input type="text" id="loginUsername" placeholder="用户名" required>
                    <label>密码</label>
                    <input type="password" id="loginPassword" placeholder="密码" required>
                    <button type="submit">登录</button>
                </form>
            </section>
        </section>

        <section id="dashboard" class="container">
            <section class="panel">
                <h2>个人中心</h2>
                <div id="userInfo" class="hint"></div>
                <div class="inline-actions">
                    <button id="refreshLogsBtn" class="secondary" type="button">刷新记录</button>
                    <button id="logoutBtn" type="button">退出登录</button>
                </div>
            </section>

            <section class="panel">
                <h2>添加学习记录</h2>
                <form id="addLogForm">
                    <label>标题</label>
                    <input type="text" id="logTitle" placeholder="例如：数学复习" required>
                    <label>内容</label>
                    <textarea id="logContent" placeholder="记录今天学习内容" required></textarea>
                    <button type="submit">保存记录</button>
                </form>
            </section>
        </section>

        <section id="adminSection" class="panel">
            <h2>管理员后台</h2>
            <div class="inline-actions">
                <button id="refreshUsersBtn" class="secondary" type="button">刷新用户列表</button>
            </div>
            <ul id="adminUserList"></ul>
        </section>

        <section class="panel" style="margin-top: 24px;">
            <h2>我的学习记录</h2>
            <ul id="studyList"></ul>
        </section>
    </main>

    <script>
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.style.display = 'block';
            status.classList.toggle('error', isError);
        }

        async function requestJson(url, options = {}) {
            const response = await fetch(url, {
                headers: { 'Content-Type': 'application/json', ...(options.headers || {}) },
                ...options
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
                throw new Error(data.error || '请求失败');
            }
            return data;
        }

        function getToken() {
            return localStorage.getItem('sunshine_token');
        }

        function saveToken(token) {
            localStorage.setItem('sunshine_token', token);
        }

        function clearToken() {
            localStorage.removeItem('sunshine_token');
        }

        function renderUserCard(user) {
            const userInfo = document.getElementById('userInfo');
            userInfo.innerHTML = `
                <strong>当前用户：</strong> ${user.username} <br>
                <strong>角色：</strong> ${user.role || 'user'}
            `;
        }

        function renderLogs(logs) {
            const list = document.getElementById('studyList');
            if (!logs || logs.length === 0) {
                list.innerHTML = '<p>暂无学习记录</p>';
                return;
            }
            list.innerHTML = logs.map(log => `
                <li>
                    <strong>${log.title}</strong>
                    <div>${log.content}</div>
                    <small>${log.created_at}</small>
                </li>
            `).join('');
        }

        function renderAdminUsers(users) {
            const list = document.getElementById('adminUserList');
            if (!users || users.length === 0) {
                list.innerHTML = '<p>暂无用户</p>';
                return;
            }
            list.innerHTML = users.map(user => `
                <li>
                    <strong>${user.username}</strong>
                    <span>（${user.role}）</span>
                    <small>${user.created_at}</small>
                </li>
            `).join('');
        }

        async function loadCurrentUser() {
            const token = getToken();
            if (!token) {
                return false;
            }
            try {
                const result = await requestJson('/me', {
                    method: 'GET',
                    headers: { Authorization: `Bearer ${token}` }
                });
                renderUserCard(result.user);
                document.getElementById('dashboard').style.display = 'grid';
                document.getElementById('authPanel').style.display = 'none';
                await loadStudyLogs();
                if (result.user.role === 'admin') {
                    document.getElementById('adminSection').style.display = 'block';
                    await loadAdminUsers();
                } else {
                    document.getElementById('adminSection').style.display = 'none';
                }
                return true;
            } catch (error) {
                clearToken();
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('authPanel').style.display = 'grid';
                return false;
            }
        }

        async function loadStudyLogs() {
            const token = getToken();
            if (!token) return;
            const result = await requestJson('/study/list', {
                method: 'GET',
                headers: { Authorization: `Bearer ${token}` }
            });
            renderLogs(result.logs);
        }

        async function loadAdminUsers() {
            const token = getToken();
            if (!token) return;
            try {
                const result = await requestJson('/admin/users', {
                    method: 'GET',
                    headers: { Authorization: `Bearer ${token}` }
                });
                renderAdminUsers(result.users);
            } catch (error) {
                renderAdminUsers([]);
                showStatus(error.message, true);
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            try {
                const username = document.getElementById('registerUsername').value.trim();
                const password = document.getElementById('registerPassword').value;
                const role = document.getElementById('registerRole').value;
                const result = await requestJson('/register', {
                    method: 'POST',
                    body: JSON.stringify({ username, password, role })
                });
                saveToken(result.token);
                renderUserCard(result.user);
                showStatus('注册成功：' + result.user.username + '（' + result.user.role + '）');
                document.getElementById('dashboard').style.display = 'grid';
                document.getElementById('authPanel').style.display = 'none';
                await loadStudyLogs();
                if (result.user.role === 'admin') {
                    document.getElementById('adminSection').style.display = 'block';
                    await loadAdminUsers();
                }
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            try {
                const username = document.getElementById('loginUsername').value.trim();
                const password = document.getElementById('loginPassword').value;
                const result = await requestJson('/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                saveToken(result.token);
                renderUserCard(result.user);
                showStatus('登录成功：' + result.user.username + '（' + result.user.role + '）');
                document.getElementById('dashboard').style.display = 'grid';
                document.getElementById('authPanel').style.display = 'none';
                await loadStudyLogs();
                if (result.user.role === 'admin') {
                    document.getElementById('adminSection').style.display = 'block';
                    await loadAdminUsers();
                }
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        document.getElementById('addLogForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const token = getToken();
            if (!token) {
                showStatus('请先登录', true);
                return;
            }
            try {
                const title = document.getElementById('logTitle').value.trim();
                const content = document.getElementById('logContent').value.trim();
                await requestJson('/study/add', {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${token}` },
                    body: JSON.stringify({ title, content })
                });
                document.getElementById('addLogForm').reset();
                showStatus('学习记录已保存');
                await loadStudyLogs();
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', async function () {
            const token = getToken();
            if (!token) return;
            try {
                await requestJson('/logout', {
                    method: 'POST',
                    headers: { Authorization: `Bearer ${token}` }
                });
            } catch (error) {
                // ignore
            }
            clearToken();
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('authPanel').style.display = 'grid';
            document.getElementById('adminSection').style.display = 'none';
            showStatus('已退出登录');
        });

        document.getElementById('refreshLogsBtn').addEventListener('click', loadStudyLogs);
        document.getElementById('refreshUsersBtn').addEventListener('click', loadAdminUsers);

        window.addEventListener('DOMContentLoaded', async function () {
            const token = getToken();
            if (token) {
                await loadCurrentUser();
            }
        });
    </script>
</body>
</html>
